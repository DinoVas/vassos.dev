<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konstantinos Vassos</title>
<meta name="description" content="Konstantinos Vassos — programmer and AI automation.">
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --accent:#4f46e5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121214; --fg:#f5f5f4; --muted:#a8a29e; --accent:#a5b4fc; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6; padding: 0 16px;
  }
  main { max-width: 34rem; }
  h1 { font-size: clamp(2rem, 6vw, 3rem); line-height: 1.1; margin: 0 0 .5rem; letter-spacing: -.02em; }
  p { margin: 0 0 1rem; color: var(--muted); font-size: 1.1rem; }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid currentColor; }
  a:hover { opacity: .8; }
</style>
</head>
<body>
<main>
  <h1>Konstantinos Vassos</h1>
  <p>Programmer building AI automation and the workflows around it.</p>
  <p><a href="https://github.com/DinoVas">GitHub</a></p>
</main>
</body>
</html>
