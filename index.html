<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konstantinos Vassos</title>
<meta name="description" content="Konstantinos Vassos builds AI automations and the workflows around them. This site is being built.">
<meta name="theme-color" content="#12306b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --blueprint: #12306b;
    --blueprint-deep: #0b2150;
    --grid: rgba(190, 215, 255, .09);
    --grid-major: rgba(190, 215, 255, .17);
    --chalk: #eaf1ff;
    --chalk-soft: #b9cbee;
    --tape: #ffc933;
    --pulse-time: 3.6s;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    color: var(--chalk);
    font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 1.0625rem;
    line-height: 1.6;
    background-color: var(--blueprint);
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(60, 110, 210, .35), transparent 60%),
      radial-gradient(ellipse at 100% 100%, var(--blueprint-deep), transparent 55%),
      linear-gradient(var(--grid-major) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: auto, auto, 120px 120px, 120px 120px, 24px 24px, 24px 24px;
    background-position: 0 0, 0 0, -1px -1px, -1px -1px, -1px -1px, -1px -1px;
  }

  main {
    min-height: 100%;
    max-width: 66rem;
    margin: 0 auto;
    padding: clamp(2.5rem, 9vh, 6rem) 16px clamp(2rem, 6vh, 4rem);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(2.5rem, 8vh, 5rem);
  }

  h1 {
    margin: 0;
    max-width: 13ch;
    font-family: "Bricolage Grotesque", "Instrument Sans", sans-serif;
    font-weight: 700;
    font-size: clamp(2.6rem, 9vw, 5.6rem);
    line-height: 1.02;
    letter-spacing: -.035em;
    text-wrap: balance;
  }

  .lede {
    margin: 1.25rem 0 0;
    max-width: 34rem;
    color: var(--chalk-soft);
  }

  .lede strong { color: var(--chalk); font-weight: 600; }

  /* the workflow canvas */
  .flow {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
  }

  .node {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: .85rem;
    min-width: 11.5rem;
    padding: .9rem 1.15rem .9rem .95rem;
    border-radius: 14px;
    border: 1.5px solid rgba(234, 241, 255, .7);
    background: rgba(11, 33, 80, .72);
    backdrop-filter: blur(2px);
  }

  .node b {
    display: block;
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 500;
    font-size: 1.15rem;
    line-height: 1.2;
  }

  .node span.state {
    display: block;
    font-size: .9rem;
    color: var(--chalk-soft);
  }

  .badge {
    flex: 0 0 auto;
    width: 2.25rem;
    height: 2.25rem;
    border-radius: 50%;
    display: grid;
    place-items: center;
  }

  .node.done .badge { background: var(--chalk); color: var(--blueprint); }
  .node.done .badge svg { width: 1.1rem; height: 1.1rem; }

  .node.running {
    border-color: var(--tape);
    box-shadow: 0 0 0 0 rgba(255, 201, 51, 0);
    animation: arrive var(--pulse-time) ease-in-out infinite;
  }
  .node.running .state { color: var(--tape); }
  .node.running .badge {
    border: 3px solid rgba(255, 201, 51, .25);
    border-top-color: var(--tape);
    animation: spin 1.1s linear infinite;
  }

  .node.waiting {
    border-style: dashed;
    border-color: rgba(234, 241, 255, .38);
    background: transparent;
  }
  .node.waiting .badge { border: 2px dashed rgba(234, 241, 255, .45); }
  .node.waiting b, .node.waiting .state { opacity: .72; }

  /* connectors */
  .link {
    position: relative;
    flex: 1 1 3rem;
    min-width: 2.5rem;
    height: 2px;
    background: rgba(234, 241, 255, .55);
  }
  .link.later {
    background: none;
    border-top: 2px dashed rgba(234, 241, 255, .35);
    height: 0;
  }
  .link.active::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 0;
    width: 11px;
    height: 11px;
    margin: -5.5px 0 0 -5.5px;
    border-radius: 50%;
    background: var(--tape);
    box-shadow: 0 0 14px 3px rgba(255, 201, 51, .55);
    animation: travel-x var(--pulse-time) ease-in-out infinite;
  }

  .foot {
    margin: 0;
    color: var(--chalk-soft);
    font-size: .95rem;
  }

  .foot a {
    color: var(--chalk);
    text-decoration: underline;
    text-decoration-thickness: 1.5px;
    text-underline-offset: .22em;
  }
  .foot a:hover { color: var(--tape); }
  .foot a:focus-visible {
    outline: 3px solid var(--tape);
    outline-offset: 4px;
    border-radius: 2px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  @keyframes travel-x {
    0%   { left: 0;    opacity: 0; }
    12%  { opacity: 1; }
    72%  { left: 100%; opacity: 1; }
    78%, 100% { left: 100%; opacity: 0; }
  }
  @keyframes travel-y {
    0%   { top: 0;    opacity: 0; }
    12%  { opacity: 1; }
    72%  { top: 100%; opacity: 1; }
    78%, 100% { top: 100%; opacity: 0; }
  }

  @keyframes arrive {
    0%, 68%  { box-shadow: 0 0 0 0 rgba(255, 201, 51, 0); }
    76%      { box-shadow: 0 0 0 7px rgba(255, 201, 51, .28); }
    100%     { box-shadow: 0 0 0 14px rgba(255, 201, 51, 0); }
  }

  /* stack the workflow on narrow screens */
  @media (max-width: 40rem) {
    .flow { flex-direction: column; align-items: stretch; }
    .node { min-width: 0; }
    .link { flex: 0 0 2.75rem; width: 2px; height: auto; min-width: 0; margin-left: 1.95rem; }
    .link.later { width: 0; border-top: 0; border-left: 2px dashed rgba(234, 241, 255, .35); }
    .link.active::after {
      top: 0; left: 50%;
      margin: -5.5px 0 0 -5.5px;
      animation-name: travel-y;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .node.running, .node.running .badge, .link.active::after { animation: none; }
    .link.active::after { opacity: 1; left: 100%; }
    @media (max-width: 40rem) { .link.active::after { left: 50%; top: 100%; } }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Something is being built here.</h1>
    <p class="lede"><strong>Konstantinos Vassos</strong> builds AI automations and the workflows around them. This site is next in the queue.</p>
  </header>

  <ol class="flow" aria-label="Site status: plan done, build running, launch waiting">
    <li class="node done">
      <span class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </span>
      <div><b>Plan</b><span class="state">Done</span></div>
    </li>
    <li class="link active" aria-hidden="true"></li>
    <li class="node running">
      <span class="badge" aria-hidden="true"></span>
      <div><b>Build</b><span class="state">Running</span></div>
    </li>
    <li class="link later" aria-hidden="true"></li>
    <li class="node waiting">
      <span class="badge" aria-hidden="true"></span>
      <div><b>Launch</b><span class="state">Waiting</span></div>
    </li>
  </ol>

</main>
</body>
</html>
